name: IndexNow

# Tells IndexNow engines (Bing, Yandex, Seznam, Naver, Yep…) which public URLs
# changed, after Vercel reports a successful PRODUCTION deployment — so engines
# fetch the new content, not the old. Google does not use IndexNow.
# Design and change detection: scripts/indexnow.mjs. No secrets are needed: the
# IndexNow key is public by design and served at /<key>.txt.
on:
  deployment_status:

permissions:
  contents: read
  # Read the manifest artifact saved by the previous run. actions/cache cannot
  # be used here: it does not support deployment_status events (no branch ref),
  # so every run found no state and resubmitted all 72 URLs.
  actions: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The manifest recorded by the last accepted submission, kept as a
      # workflow artifact (artifacts, unlike caches, work on any event).
      - name: Restore previous manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .indexnow
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=indexnow-manifest&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > .indexnow/prev.zip
            unzip -o -q .indexnow/prev.zip -d .indexnow && rm .indexnow/prev.zip
            echo "Restored manifest artifact $id"
          else
            echo "No manifest artifact yet"
          fi

      - name: Submit changed URLs
        run: |
          node scripts/indexnow-submit.mjs --prev .indexnow/prev.json --out .indexnow/next.json --on-missing baseline

      - name: Promote manifest
        id: promote
        run: |
          if [ -f .indexnow/next.json ]; then
            mv .indexnow/next.json .indexnow/prev.json
            echo "saved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save manifest for the next deploy
        if: steps.promote.outputs.saved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-manifest
          path: .indexnow/prev.json
          retention-days: 90
          if-no-files-found: error
