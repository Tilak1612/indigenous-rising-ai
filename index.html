<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) with Consent Mode v2.
         /cookies promises analytics and marketing cookies "Require your
         consent", so storage is DENIED until the visitor opts in through the
         banner. The stored choice is read here, before gtag initialises, so a
         returning visitor who opted in is measured from their first hit.
         The key must match CONSENT_KEY in src/lib/cookie-consent.ts —
         src/__tests__/analytics-consent.test.ts executes this script. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      (function () {
        var prefs = null;
        try { prefs = JSON.parse(localStorage.getItem('cookie-consent') || 'null'); } catch (e) {}
        var analytics = prefs && prefs.analytics === true ? 'granted' : 'denied';
        var marketing = prefs && prefs.marketing === true ? 'granted' : 'denied';
        gtag('consent', 'default', {
          analytics_storage: analytics,
          ad_storage: marketing,
          ad_user_data: marketing,
          ad_personalization: marketing
        });
      })();
      gtag('js', new Date());
      // send_page_view: false — RouteChangeTracker in App.tsx sends every
      // page_view, including the landing one. With both enabled, each landing
      // was counted twice (measured on production: 2 page_view hits for one
      // load of /pricing; an in-app navigation sent 1).
      gtag('config', 'G-WB8K26EHYC', { send_page_view: false });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WB8K26EHYC"></script>
    <script>
      if (window.location.hostname === 'localhost') {
        window.gtag('set', { debug_mode: true });
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indigenous Rising AI Business Support Platform | Empowering Indigenous Entrepreneurs</title>
    <meta name="description" content="Find funding, build a business plan and access training for First Nations, Inuit and Métis businesses in Canada. OCAP®-aligned, data stored in Canada. Free to start." />
    <meta name="author" content="Indigenous Rising AI Business Support Platform" />
    
    <!-- Accessibility and SEO enhancements -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="google-site-verification" content="nhG3_XrSJWGxkk3DDufYU5DyI_LhkGmHI5uGSRk6wog" />
    <meta name="language" content="English" />
    <meta name="theme-color" content="#124C3B" />

    <!-- Open Graph / Facebook (static defaults so non-JS social scrapers get a
         valid preview; react-helmet/MetaTags refines these per route for crawlers
         that execute JS). No static canonical here on purpose — this index.html is
         served for every SPA route, so a hard-coded canonical would mis-canonicalize
         all pages to the homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Indigenous Rising AI" />
    <meta property="og:url" content="https://www.indigenousrising.ai/" />
    <meta property="og:title" content="Indigenous Rising AI — The AI platform for Indigenous business growth" />
    <meta property="og:description" content="Find funding, build your business plan and access training — all in one place, designed around OCAP® principles and the data sovereignty of your community." />
    <meta property="og:image" content="https://www.indigenousrising.ai/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_CA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Indigenous Rising AI — The AI platform for Indigenous business growth" />
    <meta name="twitter:description" content="Find funding, build your business plan and access training — all in one place." />
    <meta name="twitter:image" content="https://www.indigenousrising.ai/og-home.jpg" />

    <!-- Organization JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://www.indigenousrising.ai/#organization",
      "name": "Indigenous Rising AI",
      "url": "https://www.indigenousrising.ai/",
      "logo": "https://www.indigenousrising.ai/logo-icon.png",
      "description": "Indigenous Rising AI is a web platform that helps First Nations, Inuit and Métis entrepreneurs in Canada find funding, build a business plan and access business training, designed around OCAP® principles with data stored in Canada.",
      "areaServed": { "@type": "Country", "name": "Canada" },
      "contactPoint": [
        { "@type": "ContactPoint", "contactType": "customer support", "email": "help@indigenousrising.ai" },
        { "@type": "ContactPoint", "contactType": "privacy", "email": "privacy@indigenousrising.ai" }
      ]
    }
    </script>
    
    <!-- WebSite JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://www.indigenousrising.ai/#website",
      "name": "Indigenous Rising AI",
      "alternateName": "Indigenous Rising",
      "url": "https://www.indigenousrising.ai/",
      "publisher": { "@id": "https://www.indigenousrising.ai/#organization" },
      "description": "AI-powered business support platform for Indigenous entrepreneurs in Canada",
      "inLanguage": ["en-CA"]
    }
    </script>
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OG/Twitter meta tags are managed per-page by MetaTags component via Helmet -->

    <!-- Preconnect to critical origins for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://upxojfcdtmqtcvgbjsym.supabase.co">
    
    <!-- Brand fonts, per brand/09-brand-system spec 108: Manrope (display /
         heading), Inter (body / UI), IBM Plex Mono (data). Loaded here rather
         than only via the CSS @import so the display face is discovered in the
         initial HTML instead of after the stylesheet parses.
         Geist was dropped — nothing references it since the font map moved to
         Manrope, so it was a render-blocking request for an unused family. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
